<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicCare — School Clinic Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-banner">
      <div class="crest-badge">CC</div>
      <h1>ClinicCare Portal</h1>
      <p>School Clinic Appointment &amp; Patient Records System</p>
      <ul class="feature-bullets">
        <li>Book available clinic time slots online</li>
        <li>Track appointment status in real time</li>
        <li>Access consultations, prescriptions &amp; health records</li>
      </ul>
    </div>

    <div class="auth-card">
      <div class="tabs">
        <button id="tab-login" class="tab-btn active" type="button">Sign In</button>
        <button id="tab-register" class="tab-btn" type="button">Student Registration</button>
      </div>

      <div id="auth-alert" class="alert hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Institutional Email *</label>
          <input id="login-email" type="email" required placeholder="student@school.edu.ph" />
        </div>
        <div class="form-group">
          <label for="login-password">Password *</label>
          <input id="login-password" type="password" required placeholder="Enter your password" />
        </div>
        <button id="login-btn" type="submit" class="btn btn-primary full-width">Sign In to ClinicCare</button>
      </form>

      <form id="register-form" class="hidden">
        <div class="form-group">
          <label for="reg-name">Full Name *</label>
          <input id="reg-name" type="text" required placeholder="Juan Dela Cruz" />
        </div>
        <div class="form-group">
          <label for="reg-student-number">Student Number *</label>
          <input id="reg-student-number" type="text" required placeholder="2026-00123" />
        </div>
        <div class="form-group">
          <label for="reg-email">Institutional Email *</label>
          <input id="reg-email" type="email" required placeholder="juan.delacruz@school.edu.ph" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password (min 8 characters) *</label>
          <input id="reg-password" type="password" minlength="8" required placeholder="Create a strong password" />
        </div>
        <p class="muted mb-1">Public registration creates a Student account with a linked Patient profile.</p>
        <button id="register-btn" type="submit" class="btn btn-primary full-width">Create Student Account</button>
      </form>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
