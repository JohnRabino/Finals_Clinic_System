
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGELICARE | Clinic Management System</title>
    <link rel="stylesheet" href="css/auth.css?v=3">
</head>
<body>

    <main class="auth-container">
        <section class="brand-section">
            <div class="brand-content">
                <p class="brand-label">CLINIC MANAGEMENT SYSTEM</p>
                <h1>ANGELICARE</h1>
                <p class="brand-description">
                    Manage appointments, patient records, and clinic services
                    in one organized system.
                </p>
            </div>

            <p class="brand-footer">
                Angelicare Clinic Management System © 2026
            </p>
        </section>

        <section class="form-section">
            <div class="form-wrapper">

                <div class="form-heading">
                    <h2 id="formTitle">Welcome Back</h2>
                    <p id="formDescription">Sign in to your account to continue.</p>
                </div>

                <div class="form-tabs">
                    <button type="button" id="loginTab" class="tab active">
                        Login
                    </button>
                    <button type="button" id="registerTab" class="tab">
                        Register
                    </button>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email"
                               id="loginEmail"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password"
                               id="loginPassword"
                               placeholder="Enter your password"
                               required>
                    </div>

                    <button type="submit" class="submit-button">
                        Sign In
                    </button>
                </form>

                <form id="registerForm" class="hidden">
                    <div class="form-group">
                        <label for="registerName">Full Name</label>
                        <input type="text"
                               id="registerName"
                               placeholder="Enter your full name"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="registerStudentNumber">Student Number</label>
                        <input type="text"
                               id="registerStudentNumber"
                               placeholder="Enter your student number"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>
                        <input type="email"
                               id="registerEmail"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password"
                               id="registerPassword"
                               placeholder="At least 8 characters"
                               minlength="8"
                               required>
                    </div>

                    <button type="submit" class="submit-button">
                        Create Account
                    </button>
                </form>

                <p id="message" class="message"></p>

            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
